events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        # Documents: the browser uploads/downloads by presigned URLs straight to
        # MinIO. Path and Host go through unchanged, otherwise the signature breaks.
        # The prefix is the bucket name (MINIO_BUCKET_NAME).
        location /credit-documents/ {
            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            client_max_body_size 25m;
        }
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
