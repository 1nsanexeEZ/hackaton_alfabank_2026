events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name 176.108.248.107;
        return 301 https://alfa-hack.ru$request_uri;
    }

    server {
        listen 80;
        server_name alfa-hack.ru www.alfa-hack.ru;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 176.108.248.107;
        ssl_certificate /etc/letsencrypt/live/alfa-hack.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alfa-hack.ru/privkey.pem;
        return 301 https://alfa-hack.ru$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name alfa-hack.ru www.alfa-hack.ru;

        ssl_certificate /etc/letsencrypt/live/alfa-hack.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alfa-hack.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location /api/ {
            auth_basic off;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            auth_basic off;
            proxy_pass http://backend:8000/health;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
