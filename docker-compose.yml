services:
  db:
    image: postgres:16.4-alpine
    container_name: alfa_credit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alfa_network

  minio:
    image: soldevelo/minio:2026.7.17
    container_name: alfa_credit_minio
    user: "root"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - alfa_network

  kafka:
    image: apache/kafka:3.8.0
    container_name: alfa_credit_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics (and their DLQs) are created by the backend on startup.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    networks:
      - alfa_network

  # Моки внешних систем (ЕГРЮЛ, ФНС, БКИ, АБС, ЭДО) — настоящий HTTP-сервис, backend ходит в него
  # через адаптеры. Для демо «хаос» выключен: небольшая задержка, без случайных 503
  # (для проверки устойчивости поднимите MOCK_FAILURE_RATE). «Сбой» в БКИ отвечает 503 всегда — сценарий S-6.
  external-mocks:
    build: ./external-mocks
    container_name: alfa_credit_external_mocks
    restart: unless-stopped
    environment:
      MOCK_LATENCY_MS_MIN: ${MOCK_LATENCY_MS_MIN:-100}
      MOCK_LATENCY_MS_MAX: ${MOCK_LATENCY_MS_MAX:-400}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_BKI_ALWAYS_FAIL_INNS: ${MOCK_BKI_ALWAYS_FAIL_INNS:-7705729405}
    mem_limit: 192m
    networks:
      - alfa_network

  backend:
    build: ./backend
    container_name: alfa_credit_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin-2026!}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-credit-documents}
      # Host the browser uses for presigned URLs (nginx proxies /credit-documents/ to MinIO).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost}
      # Signing (EDO) and payout (ABS) go through the external mocks (simulated, marked in API answers).
      APPLICATIONS_EXTERNAL_MOCKS_URL: ${APPLICATIONS_EXTERNAL_MOCKS_URL:-http://external-mocks:8100}
      ENRICHMENT_MOCKS_BASE_URL: ${ENRICHMENT_MOCKS_BASE_URL:-http://external-mocks:8100}
      ENRICHMENT_SOURCE_TIMEOUT_SECONDS: ${ENRICHMENT_SOURCE_TIMEOUT_SECONDS:-3}
      ENRICHMENT_RETRIES: ${ENRICHMENT_RETRIES:-3}
      # Key rate of the Bank of Russia, % per year: the base of the offer rate in decision.
      DECISION_KEY_RATE: ${DECISION_KEY_RATE:-16.50}
      MESSAGING_MODE: ${MESSAGING_MODE:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-2026!}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
    volumes:
      - jwt-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      external-mocks:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - alfa_network

  frontend:
    build: ./frontend
    container_name: alfa_credit_frontend
    restart: unless-stopped
    networks:
      - alfa_network

  nginx:
    image: nginx:1.31.7-alpine
    container_name: alfa_credit_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - alfa_network

volumes:
  pgdata:
    name: alfa_credit_pgdata
  jwt-keys:
    name: alfa_credit_jwt_keys
  minio_data:
    name: alfa_credit_minio_data
  kafka_data:
    name: alfa_credit_kafka_data

networks:
  alfa_network:
    driver: bridge
    name: alfa_credit_network
