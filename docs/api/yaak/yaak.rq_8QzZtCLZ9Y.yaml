type: http_request
model: http_request
id: rq_8QzZtCLZ9Y
workspaceId: wk_6MYZUPM7tf
folderId: fl_XaejLZxLdI
name: Подписать договор
description: |-
  The client's simple electronic signature: the password once more
  (step-up), `offer_hash` and `document_hash` of the draft it read, the
  version of the rules it accepted. A changed offer — 409 `offer_changed`, a
  changed draft — 422 `document_changed`, old rules — 422 `rules_outdated`.
  Right after it the bank seals the contract PDF with its signature.

  Работает после «Принять предложение».

  Токен: директор ООО «Ромашка».
method: POST
url: ${[ base_url ]}/applications/:application_id/sign
urlParameters:
- enabled: true
  name: :application_id
  value: ${[ application_id ]}
headers:
- enabled: true
  name: Content-Type
  value: application/json
bodyType: application/json
body:
  text: |-
    {
      "password": "${[ demo_password ]}",
      "offer_hash": "${[ response.body.path(request='rq_XLYoOA8dUn', behavior='smart', path='$.offer_hash') ]}",
      "document_hash": "${[ response.body.path(request='rq_XLYoOA8dUn', behavior='smart', path='$.document.sha256') ]}",
      "rules_version": "${[ response.body.path(request='rq_XCd8C7N0m7', behavior='smart', path='$.version') ]}"
    }
sortPriority: 16000.0
authenticationType: bearer
authentication:
  token: ${[ token_romashka ]}
  prefix: Bearer
createdAt: '2026-10-24T00:00:00'
updatedAt: '2026-10-24T00:00:00'
