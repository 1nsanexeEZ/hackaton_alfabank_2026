name: Активировать версию политики
description: |-
  A draft or an archived version (rollback) is put in force, the active one goes to
  the archive. The built-in version: the admin's active version goes to the archive and
  the YAML policy is in force again. Already active — 409 `invalid_transition`.
  New decisions, pre-approvals and the nightly refresh go by it; old decisions keep
  their `policy_version`.

  С этого момента новые решения, предодобрения и ночной пересчёт идут этой версией. Вернуть встроенную — тот же запрос с `policy_v10` вместо версии черновика.

  Токен: администратор.
method: POST
url: ${[ base_url ]}/decision/policies/:version/activate
urlParameters:
- enabled: true
  name: :version
  value: ${[ policy_version ]}
headers: []
bodyType: null
body: {}
sortPriority: 6000.0
authenticationType: bearer
authentication:
  token: ${[ token_admin ]}
  prefix: Bearer
