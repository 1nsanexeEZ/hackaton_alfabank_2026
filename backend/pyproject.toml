[project]
name = "credit-cabinet-backend"
version = "0.1.0"
description = "Smart credit cabinet backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=13",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "faststream[kafka]>=0.6",
    "httpx>=0.28",
    "lxml>=5.3",
    "nh3>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[kafka,minio,postgres]>=4.8",
    "types-pyyaml>=6.0",
]
# Обучение ML-модели скоринга (backend/ml): только локально, в образ не попадает.
ml = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Docker (testcontainers: Postgres, Kafka, MinIO)",
    "e2e: full scenarios through HTTP and Kafka",
]
# The deploy workflow runs plain `pytest`: heavy suites are opt-in (`-m integration`).
addopts = "-m 'not integration and not e2e'"

[tool.mypy]
# Ключи реестра фасадов — Protocol: реестр ищет фасад по контракту и никогда не создаёт
# экземпляр ключа, а mypy считает передачу Protocol в type[T] ошибкой (python/mypy#4717).
disable_error_code = ["type-abstract"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# `type X = ...` aliases break FastAPI/pydantic Annotated metadata resolution.
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
# В ноутбуке путь к backend добавляется до импортов проекта.
"ml/notebooks/*.ipynb" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
known-third-party = ["alembic"]

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is plain Python"
type = "forbidden"
source_modules = ["src.modules.*.domain", "src.core.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic", "httpx", "faststream", "aiokafka", "aioboto3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on infrastructure, presentation, api and seed data"
type = "forbidden"
source_modules = ["src.modules.*.domain", "src.modules.*.application"]
forbidden_modules = ["src.modules.*.infrastructure", "src.modules.*.presentation", "src.modules.*.api", "src.modules.*.module", "seed"]
# Direct imports only: core helpers (outbox writer) may use core infrastructure inside.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain does not depend on application"
type = "forbidden"
source_modules = ["src.modules.*.domain"]
forbidden_modules = ["src.modules.*.application"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on presentation"
type = "forbidden"
source_modules = ["src.modules.*.infrastructure"]
forbidden_modules = ["src.modules.*.presentation", "src.modules.*.api", "src.modules.*.module"]

# Modules on the layout from settings/04-module-structure.md: a refactored module goes here.
# facade.py is below infrastructure (the facade adapter implements it) and above application.
[[tool.importlinter.contracts]]
name = "Layered modules: presentation -> infrastructure -> application -> domain"
type = "layers"
containers = ["src.modules.identity", "src.modules.enrichment", "src.modules.projector"]
layers = ["module", "presentation", "infrastructure", "(facade)", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Core does not know the modules"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.modules.identity", "src.modules.applications", "src.modules.process", "src.modules.products", "src.modules.clients", "src.modules.enrichment", "src.modules.scoring", "src.modules.decision", "src.modules.notifications", "src.modules.projector", "src.modules.bff", "src.main", "src.models"]

[[tool.importlinter.contracts]]
name = "identity reads other modules only through their facade"
type = "forbidden"
source_modules = ["src.modules.identity"]
forbidden_modules = ["src.modules.*.domain", "src.modules.*.application", "src.modules.*.infrastructure", "src.modules.*.presentation", "src.modules.*.api", "src.modules.*.module"]
ignore_imports = ["src.modules.identity.** -> src.modules.identity.**", "src.modules.identity.** -> src.core.**"]
# Empty modules have nothing to ignore yet.
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "applications reads other modules only through their facade"
type = "forbidden"
source_modules = ["src.modules.applications"]
