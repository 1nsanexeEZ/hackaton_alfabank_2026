[project]
name = "credit-cabinet-backend"
version = "0.1.0"
description = "Smart credit cabinet backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=13",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "faststream[kafka]>=0.6",
    "httpx>=0.28",
    "lxml>=5.3",
    "nh3>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[kafka,minio,postgres]>=4.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Docker (testcontainers: Postgres, Kafka, MinIO)",
    "e2e: full scenarios through HTTP and Kafka",
]
# The deploy workflow runs plain `pytest`: heavy suites are opt-in (`-m integration`).
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# `type X = ...` aliases break FastAPI/pydantic Annotated metadata resolution.
ignore = ["UP040"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
known-third-party = ["alembic"]

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is plain Python"
type = "forbidden"
source_modules = ["src.*.domain", "src.core.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic", "httpx", "faststream", "aiokafka", "aioboto3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain and application do not depend on infrastructure and api"
type = "forbidden"
source_modules = ["src.*.domain", "src.*.application"]
forbidden_modules = ["src.*.infrastructure", "src.*.api", "src.*.module"]

[[tool.importlinter.contracts]]
name = "Domain does not depend on application"
type = "forbidden"
source_modules = ["src.*.domain"]
forbidden_modules = ["src.*.application"]

[[tool.importlinter.contracts]]
name = "Core does not know the modules"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.identity", "src.applications", "src.process", "src.products", "src.clients", "src.enrichment", "src.scoring", "src.decision", "src.notifications", "src.projector", "src.bff", "src.main", "src.models"]

[[tool.importlinter.contracts]]
name = "identity reads other modules only through their facade"
type = "forbidden"
source_modules = ["src.identity"]
forbidden_modules = ["src.*.domain", "src.*.application", "src.*.infrastructure", "src.*.api", "src.*.module"]
ignore_imports = ["src.identity.** -> src.identity.**", "src.identity.** -> src.core.**"]
# Empty modules have nothing to ignore yet.
unmatched_ignore_imports_alerting = "none"
allow_indirect_imports = true

