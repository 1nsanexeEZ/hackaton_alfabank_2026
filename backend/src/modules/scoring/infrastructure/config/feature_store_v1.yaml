# Хранилище признаков клиента: «признаки из хранилища на дату заявки» модели оценки PD.
# Логика — в domain/client_features.py, здесь — срок годности снимка.
# Файл проверяется при старте: ошибка → приложение не стартует.
version: feature_store_v1

# Снимок признаков клиента старше стольких дней на дату заявки не берём — считаем из снимка
# обогащения заявки и сохраняем новый.
max_age_days: 30
