# Проектная оценка стартапа по бизнес-плану и финмодели (синтетическая).
# Логика — в src/modules/scoring/domain/project.py, здесь — пороги. Файл проверяется при старте:
# невалидный YAML → приложение не стартует.
version: project_v1

# Горизонт финмодели, месяцев: выручка и расходы по месяцам в шаблоне кабинета.
horizon_months: 24

# Денежный поток за горизонт (выручка − расходы) к платежам по кредиту за тот же горизонт — не
# ниже, иначе не пройдено.
min_dscr: "1.3"

# Собственные средства к финансированию проекта (свои + кредит) — не меньше.
min_own_share: "0.2"

# Покрытие кредита: (залог × дисконт + гарантия господдержки) / сумма — не меньше.
min_coverage: "0.5"
# Залог учитываем по такой доле рыночной стоимости.
collateral_discount: "0.7"
# Гарантию Корпорации МСП / РГО учитываем не выше такой доли кредита.
max_guarantee_share: "0.5"

# Секции ОКВЭД, где кредит на запуск бизнеса не выдаём: строительство, финансовое
# посредничество, операции с недвижимостью.
industry_high_sections: [41, 42, 43, 64, 66, 68]
