# Качество данных скоринга (синтетическое): развилка «Данные полные?» модели оценки PD.
# Не ответил критичный источник или признаков с данными меньше порога → quality = degraded:
# модели посчитаны, решение принимает человек. Логика — в domain/quality.py, здесь — пороги.
# Файл проверяется при старте: ошибка → приложение не стартует.
version: quality_v1

# Без них модели не на чем считать риск: ФНС — недоимка и выручка для сверки, БКИ — просрочки,
# запросы и платежи по кредитам. Сбой остальных (ГИР БО, Контур, БКИ руководителя) модели не
# касается — его разбирают стоп-факторы и маршруты решения.
critical_sources: [fns, bki]

# Доля признаков скоркарты, по которым были данные.
min_completeness: "0.7"
