# ML-модель скоринга — генерируется `uv run --group ml python -m ml.train`,
# руками не править: метрики и паритет с обучением — в metadata и ml/reports.
version: ml_logreg_v1
intercept: '-3.371946'
scaling:
  base_score: '600'
  base_odds: '50'
  pdo: '40'
grade_bands:
- grade: A
  max_pd: '0.0050'
- grade: B
  max_pd: '0.0100'
- grade: C
  max_pd: '0.0175'
- grade: D
  max_pd: '0.0275'
- grade: E
  max_pd: '0.0400'
- grade: F
  max_pd: '0.0600'
- grade: G
  max_pd: '0.0900'
- grade: H
  max_pd: '0.1400'
- grade: I
  max_pd: '0.2200'
features:
- name: business_age_months
  title: Возраст бизнеса, мес.
  kind: numeric
  coef: '-0.665019'
  missing_woe: '0.000000'
  bins:
  - upper: '12'
    woe: '-0.415070'
