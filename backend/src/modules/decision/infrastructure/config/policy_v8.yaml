# Кредитная политика v8 (синтетическая): v7 и третьи лица по 115-ФЗ.
# - Выгодоприобретатель (к чьей выгоде действует клиент: агентский договор, поручение, комиссия,
#   доверительное управление) и залогодатель — третье лицо проверяются по перечням
#   Росфинмониторинга и базе ПДЛ вместе с остальными, на каждой заявке; в перечне — отказ.
# - Клиент действует к выгоде третьего лица — ручная проверка (compliance.third_parties).
# - Нет ответа о выгодоприобретателе или у залога третьего лица не указан владелец — ручная
#   проверка; ключ require_answers выключен, пока форма заявки не задаёт вопрос.
# Остальное — как в v7. Логика правил — в domain/policy.py, здесь — пороги и коэффициенты. Файл
# проверяется при старте: ошибка → приложение не стартует. policy_v1–v7 не меняются.
version: policy_v8

# Ключевая ставка, под которую откалиброваны ставки каталога продуктов. Текущая ключевая —
# KEY_RATE; от неё считается фондирование.
key_rate_reference: "16.50"

# Шкала грейдов PD-модели. Грейд результата scorecard_v1 (A–E) переводится на неё
# (decision/domain/model.py, FROM_LEGACY).
grades: [A, B, C, D, E, F, G, H, I, J]

stop_factors:
  registry_statuses:
    liquidating: STOP_LIQUIDATION
    liquidated: STOP_LIQUIDATION
    bankrupt: STOP_BANKRUPTCY
    reorganizing: STOP_REORGANIZATION
    excluded: STOP_EXCLUDED_FROM_REGISTRY
  overdue_days: 90
  # Слабый грейд отсекают две модели (strategy.two_models), а не стоп-фактор.
  grades: []
  current_overdue_days: 30
  account_blocks: true
  tax_arrears_above: "300000"
  bankruptcy_messages: true
  enforcement_revenue_share: "0.1"
  lawsuits_revenue_share: "0.2"
  negative_equity: true
  mass_address: true
  okved_classes: ["92"]
  # Стоп-факторы — до модели и до проверки, есть ли результат скоринга.
  before_scoring: true
  # Остальные строки таблицы стоп-факторов общей схемы: недостоверность сведений ЕГРЮЛ (адрес,
  # руководитель, учредитель), массовый руководитель (ФНС), срок работы меньше минимума продукта,
  # внутренний стоп-лист банка (АБС). Нет ответа источника — проверка «не выполнена», заявка
  # уходит на ручную по сбою источников.
  unreliable_data: true
  mass_head: true
  business_age: true
  bank_stop_list: true

info_request:
  revenue_document: bank_statement

limits:
  # k(грейд) × годовая выручка (меньшая из заявленной и ФНС).
  revenue_multiplier:
    {A: "0.5", B: "0.45", C: "0.4", D: "0.3", E: "0.25", F: "0.2", G: "0.15", H: "0.1", I: "0.05", J: "0"}
  ltv: {real_estate: "0.7", vehicle: "0.6", equipment: "0.5", goods: "0.3"}
  payment_share: "0.4"
  assumed_expense_ratio: "0.8"
  amount_step: "10000"
  # Не больше этой доли оборотов по счёту за год (по выписке; нет выписки — не ограничиваем).
  turnover_multiplier: "0.5"
  # Выписки нет — обороты по счёту в банке (АБС): для этого лимита и триггера «разгон оборотов».
  bank_turnover: true
  # Не больше суммы на грейд.
  grade_max_amount:
    A: "60000000"
    B: "50000000"
    C: "40000000"
    D: "30000000"
    E: "20000000"
    F: "10000000"
    G: "5000000"
    H: "2000000"
    I: "1000000"
    J: "0"
  # Потолок на группу заёмщика минус её долг по действующим кредитам (остаток по БКИ).
  group_exposure_max: "100000000"

pricing:
  # Покрытие залогом (стоимость / сумма) от этого порога — LGD залогового кредита.
  collateral_min_coverage: "1"
  # Ставка = фондирование (ключевая + спред) + PD × LGD + капитал + маржа, в коридоре продукта.
  components:
    funding_spread: "1.0"
    lgd_unsecured: "0.45"
    lgd_secured: "0.25"
    capital: "2.0"
    margin: "3.5"
    # У результата scorecard_v1 PD нет — берём осторожную.
    pd_if_unknown: "0.10"

routing:
  # Грейд направляет к человеку матрица двух моделей; плюс всегда: сумма выше
  # auto_decision_limit продукта (проверка). Флаги расхождений и сбой источников делают заявку
  # спорной (decision/facade.py, DISPUTE_REASON_CODES).
  grades: []
  flags:
    verification_mismatch: ROUTE_VERIFICATION_MISMATCH
    revenue_mismatch: ROUTE_REVENUE_MISMATCH
    bureau_unavailable: ROUTE_SOURCES_FAILED
    mass_address: ROUTE_MASS_ADDRESS
  # «Данные полные?»: скоринг пометил данные неполными (quality = degraded) — спорная, решает
  # человек (ROUTE_SOURCES_FAILED); модели на неполных данных не отказывают.
  data_quality: true

strategy:
  # Мягкие триггеры → ручная проверка (ROUTE_SOFT_TRIGGER), не меньше проверки при любых моделях.
  soft_triggers:
    # Недоимка больше нуля, но не выше stop_factors.tax_arrears_above.
    tax_arrears: true
    # Запись о руководителе в ЕГРЮЛ моложе стольких месяцев.
    head_change_months: 6
    # Поступления за последние recent_months месяцев выписки в среднем больше ratio × средних
    # за прежние месяцы.
    turnover_spike: {recent_months: 3, ratio: "1.5"}
  # Две модели: зона по грейду (одна шкала A–J у обеих), строка матрицы — зона PD-модели,
  # столбец — зона ML-модели. approve — дальше лимиты (может стать встречным предложением),
  # check — проверка андеррайтером (ROUTE_MODELS_CHECK), dispute — спорная, решает андеррайтер
  # (ROUTE_MODELS_DISAGREE), reject — отказ (STOP_MODELS_HIGH_RISK). Оценки ML нет — спорная.
  two_models:
    zones:
      green: [A, B, C, D]   # PD < 2,75%
      yellow: [E, F, G]     # 2,75–9%
      red: [H, I, J]        # от 9%
    matrix:
      green: {green: approve, yellow: check, red: dispute}
      yellow: {green: check, yellow: check, red: dispute}
      red: {green: dispute, yellow: dispute, red: reject}
  # Матрица грейд × сумма общей схемы — вместе с двумя моделями, решает строже из двух: зоны моделей
  # — можно ли одобрить автоматически, корзина грейда PD-модели — до какой суммы. Выше автоматики
  # корзины — проверка (ROUTE_RISK_MATRIX), выше ручной — отказ (STOP_RISK_MATRIX). Предодобрение не
  # выше автоматики корзины осторожного грейда.
  risk_matrix:
    - {label: "A–C", grades: [A, B, C], approve_up_to: "50000000"}
    - {label: "D–E", grades: [D, E], approve_up_to: "15000000", manual_up_to: "50000000"}
    - {label: "F–G", grades: [F, G], approve_up_to: "5000000", manual_up_to: "20000000"}
    - {label: "H–J", grades: [H, I, J], approve_up_to: "0", manual_up_to: "3000000"}
  # Поручительство собственника в оффере — для этих грейдов или суммы строго больше.
  guarantee:
    grades: [F, G]
    amount_above: "20000000"

# Продукты для стартапа (products: startup_only). Без пройденного и действующего на дату подачи
# предскрина учредителя — STOP_FOUNDER_PRESCREEN. Матрица двух моделей не применяется: решает
# андеррайтер на проектной оценке (маршрут startup_v1).
startup:
  products: [STARTUP]

# Обязательные требования закона (policy_v6).
compliance:
  # 115-ФЗ. Совпадение с перечнями Росфинмониторинга, решениями МВК и ФРОМУ — всегда отказ
  # (обслуживать такое лицо закон запрещает); проверка не выполнена или ПДЛ — ручная проверка.
  aml:
    # Уровень риска на платформе «Знай своего клиента» Банка России.
    zsk_stop_levels: [high]
    zsk_review_levels: [medium]
  # ст. 16 152-ФЗ: решение только на основании автоматизированной обработки по физлицу (ИП) —
  # с его согласием. Без согласия эти исходы готовит человек.
  automated_decision_consent:
    legal_forms: [IE]
    outcomes: [REJECT, COUNTER_OFFER]
  # 115-ФЗ, третьи лица (policy_v8). Совпадение выгодоприобретателя или залогодателя с перечнем —
  # отказ, как у всех участников проверки (compliance.aml).
  third_parties:
    # Клиент действует к выгоде третьего лица — ручная проверка.
    beneficiary_review: true
    # Нет ответа о выгодоприобретателе или у залога третьего лица не указан владелец — ручная
    # проверка. Включить, когда форма заявки спросит (до этого факт пишется только в трассу).
    require_answers: false

alternatives:
  cash_gap_products: [OVERDRAFT, CREDIT_LINE]
  secured_product: SECURED
  small_amount_product: OVERDRAFT

offer:
  valid_days: 7
