  # по ИП готовит человек.
  # 115-ФЗ, третьи лица (policy_v8): без перечней и подробностей проверки.
  ROUTE_THIRD_PARTY_BENEFICIARY:
    text: "Заявке нужна дополнительная проверка специалистом."
  ROUTE_THIRD_PARTIES_UNKNOWN:
    text: "Чтобы рассмотреть заявку, нам нужно знать, действуете ли вы в интересах третьего лица и кому принадлежит залог."
    hint: "Укажите это в заявке — специалист банка может уточнить сведения у вас."
  ROUTE_AUTOMATED_DECISION_CONSENT:
    text: "Вы не давали согласия на решение в автоматическом режиме, поэтому заявку рассмотрит специалист."

