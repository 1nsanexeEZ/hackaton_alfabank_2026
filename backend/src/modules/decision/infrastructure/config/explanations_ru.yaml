  STOP_AML_LISTED:
    text: "Банк не может предоставить кредит по результатам обязательных проверок."
  STOP_ZSK_HIGH_RISK:
    text: "Банк не может предоставить кредит по результатам обязательных проверок."
    hint: "Если считаете решение ошибочным, обратитесь в банк: порядок пересмотра установлен законом."
  STOP_REORGANIZATION:
    text: "По данным государственного реестра компания находится в процессе реорганизации."
    hint: "Подайте заявку после завершения реорганизации."
  STOP_EXCLUDED_FROM_REGISTRY:
    text: "По данным государственного реестра компания исключена из реестра."
  STOP_UNRELIABLE_DATA:
    text: "В государственном реестре есть отметка о недостоверности сведений о компании."
    hint: "Исправьте сведения в реестре и подайте заявку снова."
  STOP_MASS_HEAD:
    text: "По данным ФНС у руководителя компании признаки массового руководителя."
  STOP_BUSINESS_TOO_YOUNG:
    text: "Компания работает меньше срока, который нужен для этого продукта."
    hint: "Посмотрите продукты для молодого бизнеса или подайте заявку позже."
  STOP_BANK_STOP_LIST:
    text: "Банк не может предоставить кредит по результатам внутренних проверок."
  ROUTE_AML_INCOMPLETE:
    text: "Обязательная проверка сведений о компании ещё не завершена, поэтому заявку проверит специалист."
  ROUTE_ZSK_MEDIUM_RISK:
    text: "Заявке нужна дополнительная проверка специалистом."
  ROUTE_PEP:
    text: "Заявке нужна дополнительная проверка специалистом."
