    text: "Заявку на такую сумму при текущем финансовом положении компании рассмотрит специалист."
    hint: "Со свежей отчётностью или выпиской по счёту специалист решит быстрее."
  ROUTE_SOFT_TRIGGER:
    text: "Специалист уточнит несколько деталей о компании перед решением."
    hint: "Держите под рукой свежую выписку по счёту и сведения о руководителе."
  LIMIT_BY_TURNOVER:
    text: "Мы можем предложить {amount} вместо {requested_amount}: сумма ограничена оборотами по счёту."
    hint: "Когда обороты по счёту вырастут, лимит увеличится."
  LIMIT_BY_GRADE:
    text: "Мы можем предложить {amount} вместо {requested_amount}: это максимум при текущем финансовом положении компании."
