    hint: "Пройдите проверку учредителя в кабинете и подайте заявку снова."
  STOP_MODELS_HIGH_RISK:
    text: "По совокупности данных о компании мы не можем сейчас предложить кредит."
    hint: "Вернитесь с заявкой, когда обновится отчётность или снизится долговая нагрузка."
  ROUTE_MODELS_CHECK:
    text: "Специалист банка посмотрит заявку перед решением."
    hint: "Со свежей отчётностью или выпиской по счёту специалист решит быстрее."
  ROUTE_MODELS_DISAGREE:
    text: "Заявку подробно рассмотрит специалист банка."
    hint: "Со свежей отчётностью или выпиской по счёту специалист решит быстрее."
  ROUTE_ML_UNAVAILABLE:
    text: "Заявку рассмотрит специалист банка."
