    text: "По бухгалтерской отчётности собственный капитал компании отрицательный."
    hint: "Вернитесь с новой заявкой после годовой отчётности с положительным капиталом."
  STOP_MASS_ADDRESS:
    text: "Компания зарегистрирована по адресу массовой регистрации."
    hint: "Если компания сменила адрес, обновите сведения в реестре и подайте заявку снова."
  STOP_FORBIDDEN_OKVED:
    text: "Банк не кредитует этот вид деятельности."
