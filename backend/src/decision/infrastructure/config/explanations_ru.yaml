# Тексты решения для клиента. Без внутренних цифр модели, порогов и названий правил:
# что произошло и что можно сделать. Подстановки: {amount} — сумма предложения,
# {requested_amount} — запрошенная сумма, {term} — срок, мес., {month} — месяц кассового
# разрыва («ноябре 2026»), {product} — название продукта, {collateral} — вид залога.
version: explanations_v1

outcomes:
  APPROVE: "Заявка одобрена на запрошенных условиях."
  COUNTER_OFFER: "Мы подготовили встречное предложение."
  REQUEST_INFO: "Чтобы принять решение, нам нужно немного больше информации."
  MANUAL_REVIEW: "Заявку рассмотрит специалист банка, обычно это занимает до двух рабочих дней."
  REJECT: "К сожалению, сейчас мы не можем одобрить заявку."

reasons:
  STOP_LIQUIDATION:
    text: "По данным государственного реестра компания находится в процессе ликвидации."
  STOP_BANKRUPTCY:
    text: "По данным государственного реестра в отношении компании ведётся процедура банкротства."
  STOP_DISQUALIFIED_HEAD:
    text: "По данным ФНС руководитель компании не может занимать эту должность."
    hint: "Если сведения в реестре устарели, обновите их и подайте заявку снова."
  STOP_OVERDUE_90:
    text: "Решение принято по результатам проверки кредитной истории."
    hint: "Погашение текущей задолженности перед другими кредиторами улучшит оценку."
  STOP_GRADE_E:
    text: "По совокупности данных о компании мы не можем предложить кредит сейчас."
    hint: "Вернитесь с новой заявкой, когда обновится отчётность компании."
  INFO_REVENUE_NOT_CONFIRMED:
    text: "Подтвердите выручку выпиской по счёту за 6 месяцев."
    hint: "Выписку можно выгрузить из интернет-банка в формате CSV."
  LIMIT_BY_PRODUCT:
    text: "Мы можем предложить {amount} вместо {requested_amount}: это максимум по выбранному продукту."
  LIMIT_BY_REVENUE:
    text: "Мы можем предложить {amount} вместо {requested_amount}: сумма ограничена текущей выручкой компании."
    hint: "Если выручка вырастет или появится залог, лимит увеличится."
  LIMIT_BY_LTV:
    text: "Мы можем предложить {amount} вместо {requested_amount}: сумма ограничена стоимостью залога."
    hint: "Дополнительный залог позволит увеличить сумму."
  LIMIT_BY_PAYMENT_CAPACITY:
    text: "Мы можем предложить {amount} вместо {requested_amount}: больше бизнес сейчас не сможет комфортно обслуживать."
    hint: "Снижение текущей долговой нагрузки увеличит доступную сумму."
  LIMIT_BELOW_PRODUCT_MIN:
    text: "Доступная сумма меньше минимальной по выбранному продукту."
    hint: "Попробуйте подать заявку на меньшую сумму или другой продукт."
  TERM_ADJUSTED:
    text: "Срок кредита — {term} мес., чтобы ежемесячный платёж был посильным."
  ROUTE_AMOUNT_OVER_AUTO_LIMIT:
    text: "Заявки на такую сумму специалист рассматривает лично."
  ROUTE_GRADE_D:
    text: "Специалист внимательнее посмотрит на финансовое положение компании."
    hint: "Свежая отчётность или выписка по счёту ускорят рассмотрение."
  ROUTE_VERIFICATION_MISMATCH:
    text: "Данные компании в кабинете расходятся с государственным реестром, специалист их сверит."
    hint: "Проверьте сведения о руководителе в профиле компании."
  ROUTE_REVENUE_MISMATCH:
    text: "Выписка не подтвердила заявленную выручку, специалист проверит финансовые данные."
    hint: "Укажите в отчётности фактическую выручку компании."
  ROUTE_SOURCES_FAILED:
    text: "Один из источников данных временно не ответил, поэтому заявку проверит специалист."
  ROUTE_MASS_ADDRESS:
    text: "Адрес регистрации компании требует дополнительной проверки."
    hint: "Подготовьте договор аренды или документ о праве собственности на помещение."
  CASH_GAP_FORECAST:
    text: "По выписке ожидается кассовый разрыв в {month}, для него удобнее {product}."
    hint: "На период кассового разрыва удобнее {product}: проценты только за использованные деньги."

notes:
  cash_gap_no_alternative: "По выписке ожидается кассовый разрыв в {month}, заложите резерв на этот период."
  alternative: "Можем предложить другой продукт: {product}."

conditions:
  collateral: "Залог: {collateral}"
  guarantee_owner: "Поручительство собственника бизнеса"
  guarantee_msp_corporation: "Поручительство Корпорации МСП"
  target_use: "Подтверждение целевого использования средств"
  cash_gap: "На период кассового разрыва в {month} рекомендуем {product}"

products:
  UNSECURED: "кредит без залога"
  SECURED: "кредит под залог"
  CREDIT_LINE: "кредитная линия"
  OVERDRAFT: "овердрафт"
  AUTO: "автокредит для бизнеса"
  MORTGAGE: "бизнес-ипотека"
  REFINANCE: "рефинансирование"
  GOV_SUPPORT: "кредит с господдержкой"

collateral_types:
  real_estate: "недвижимость"
  vehicle: "транспорт"
  equipment: "оборудование"
  goods: "товары в обороте"
