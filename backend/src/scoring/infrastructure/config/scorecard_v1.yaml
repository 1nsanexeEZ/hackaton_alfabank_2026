# Скоркарта scorecard_v1 — синтетическая, откалибрована под демо-сценарии §9.
# Логика факторов — в src/scoring/domain/scorecard.py; здесь только база, пороги грейдов и
# баллы корзин. Файл валидируется Pydantic-схемой при старте: невалидный YAML → приложение не стартует.
# Ориентиры калибровки: romashka (S-1) ≈ 790 → A; ivanov (S-2, с выпиской и разрывом) ≈ 565 → C.

version: scorecard_v1
base: 600

# Нижние границы грейдов (E — всё, что ниже D). A ≥ 750 · B 650–749 · C 550–649 · D 450–549 · E < 450.
grades:
  A: 750
  B: 650
  C: 550
  D: 450

# Секции ОКВЭД по уровню отраслевого риска (целая часть кода до точки).
industry_sections:
  low: [62, 63, 69, 70, 71, 72, 73, 74, 86]
  high: [41, 42, 43, 55, 56, 79]

factors:
  business_age: # месяцы с регистрации (калибровка: <12 → −10, мягче базовых −40)
    lt12: -10
    m12_24: 0
    m24_60: 30
    gt60: 50
  revenue_trend: # выручка год к году
    down20: -50
    down0: -10
    up20: 20
    up_more: 40
  debt_load: # (платежи по БКИ + оценочный платёж) / средняя месячная выручка (0,4–0,6 → −10)
    lt02: 50
    lt04: 10
    lt06: -10
    gt06: -100
  bureau_overdue: # макс. просрочка за 12 мес; thin — истории нет (−10, без маршрутизации)
    none: 40
    d1_30: -30
    d31_90: -120
    d90_plus: -200
    thin: -10
  bureau_inquiries: # запросов за 30 дней
    le2: 0
    i3_5: -15
    gt5: -40
  tax_arrears: # недоимка ФНС
    none: 10
    any: -60
  industry_risk:
    low: 20
    mid: 0
    high: -30
  amount_to_revenue: # сумма / годовая выручка (>0,5 → −40)
    lt01: 30
    lt03: 0
    lt05: -40
    gt05: -40
  revenue_consistency: # заявленная выручка vs ФНС
    le15: 10
    p15_30: -20
    gt30: -60
  verification: # статус верификации компании
    verified: 10
    mismatch: -30
    other: 0
  collateral_coverage: # залог / сумма (для залоговых продуктов)
    ge2: 40
    c1_2: 20
    lt1: 0
  cash_gap: # прогноз кассового разрыва по выписке
    gap: -15
    no_gap: 10
