name: Test and Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --dev
        working-directory: ./backend

      - name: Run tests (Unit, Integration, E2E)
        run: |
          uv run pytest -v
        working-directory: ./backend

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            cd ~/hackaton_alfabank_2026

            git remote set-url origin git@github.com:1nsanexeEZ/hackaton_alfabank_2026.git
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy_key -o StrictHostKeyChecking=no"

            git fetch origin
 
            git reset --hard origin/main
            
            docker-compose down
            
            docker-compose up -d --build --remove-orphans
            
            docker-compose restart nginx || true
            
            docker image prune -f
            
            docker-compose ps
