name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Tag points to main
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Деплой только с тега vX.Y.Z"; exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Тег стоит на коммите не из main"; exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://alfa-hack.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: SSH key and known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "$TARGET" "bash -s -- $SHA" < docker/deploy.sh

      - name: Smoke test from outside
        run: |
          for i in $(seq 1 20); do
            curl -fsS https://alfa-hack.ru/health && exit 0
            sleep 5
          done
          echo "::error::https://alfa-hack.ru/health не отвечает"; exit 1
