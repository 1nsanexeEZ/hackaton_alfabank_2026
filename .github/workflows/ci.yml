name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./backend

jobs:
  backend:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Module boundaries
        run: uv run lint-imports

      # Модули, в которых mypy чист; остальные добавляются сюда по мере починки.
      - name: Types
        run: uv run mypy src/modules/scoring src/modules/products src/modules/decision src/modules/assistant src/modules/market

      - name: Tests
        run: uv run pytest -q

  migrations:
    name: Alembic on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Single head
        run: test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Upgrade, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Models match migrations
        run: uv run alembic check

  integration:
    name: Integration tests (Kafka, Postgres in containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q -m integration

  external-mocks:
    name: External mocks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./external-mocks
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        if: hashFiles('external-mocks/pyproject.toml') != ''
        with:
          python-version: '3.12'

      - name: Lint and tests
        if: hashFiles('external-mocks/pyproject.toml') != ''
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # в PR находка валит проверку; в деплое по тегу (workflow_call) только предупреждает,
    # чтобы свежая уязвимость в базе не блокировала выкатку уже проверенной версии
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Python dependencies (backend, external-mocks)
        run: |
          set -e
          for project in backend external-mocks; do
            echo "== $project"
            (cd "$project" && uv export --frozen --no-dev --no-hashes --no-emit-project -q -o "$RUNNER_TEMP/$project.txt")
            uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/$project.txt" --no-deps --disable-pip --progress-spinner off
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high

  stand:
    name: Stand starts like the jury runs it
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Start the stand
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke checks
        run: |
          set -e
          B=http://localhost:8080
          curl -fsS -o /dev/null "$B/"
          curl -fsS "$B/api/ready"
          curl -fsS -o /dev/null "$B/api/products"
          TOKEN=$(curl -fsS -X POST "$B/api/auth/demo-login" -H 'Content-Type: application/json' \
            -d '{"login":"owner@romashka.test"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -o /dev/null "$B/api/bff/dashboard" -H "Authorization: Bearer $TOKEN"
          # The assistant without the `ai` profile: templates, no error.
          curl -fsS "$B/api/assistant/status" | grep -q '"mode":"rules"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop
        if: always()
        run: docker compose down -v
